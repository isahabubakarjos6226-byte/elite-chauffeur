openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Elite Chauffeur Service API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cars
    description: Fleet management
  - name: drivers
    description: Driver management
  - name: reservations
    description: Booking management
  - name: pricing
    description: Pricing configuration
  - name: dashboard
    description: Dashboard analytics
  - name: distance
    description: Distance calculation

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /cars:
    get:
      operationId: listCars
      tags: [cars]
      summary: List all cars
      parameters:
        - name: available
          in: query
          schema:
            type: boolean
        - name: category
          in: query
          schema:
            type: string
            enum: [with_driver, without_driver, both]
      responses:
        "200":
          description: List of cars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Car"
    post:
      operationId: createCar
      tags: [cars]
      summary: Create a new car
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCarBody"
      responses:
        "201":
          description: Car created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"

  /cars/{id}:
    get:
      operationId: getCar
      tags: [cars]
      summary: Get a car by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Car details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateCar
      tags: [cars]
      summary: Update a car
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCarBody"
      responses:
        "200":
          description: Car updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCar
      tags: [cars]
      summary: Delete a car
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /drivers:
    get:
      operationId: listDrivers
      tags: [drivers]
      summary: List all drivers
      parameters:
        - name: available
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of drivers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Driver"
    post:
      operationId: createDriver
      tags: [drivers]
      summary: Create a driver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDriverBody"
      responses:
        "201":
          description: Driver created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"

  /drivers/{id}:
    get:
      operationId: getDriver
      tags: [drivers]
      summary: Get a driver by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Driver details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateDriver
      tags: [drivers]
      summary: Update a driver
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDriverBody"
      responses:
        "200":
          description: Driver updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"
    delete:
      operationId: deleteDriver
      tags: [drivers]
      summary: Delete a driver
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /reservations:
    get:
      operationId: listReservations
      tags: [reservations]
      summary: List all reservations
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, in_progress, completed, cancelled]
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
    post:
      operationId: createReservation
      tags: [reservations]
      summary: Create a reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationBody"
      responses:
        "201":
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"

  /reservations/{id}:
    get:
      operationId: getReservation
      tags: [reservations]
      summary: Get a reservation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reservation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateReservation
      tags: [reservations]
      summary: Update a reservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReservationBody"
      responses:
        "200":
          description: Reservation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
    delete:
      operationId: deleteReservation
      tags: [reservations]
      summary: Delete/cancel a reservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /reservations/calendar:
    get:
      operationId: getCalendarReservations
      tags: [reservations]
      summary: Get reservations formatted for calendar display
      parameters:
        - name: month
          in: query
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Calendar reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"

  /pricing:
    get:
      operationId: listPricing
      tags: [pricing]
      summary: List all pricing tiers
      responses:
        "200":
          description: Pricing tiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PricingTier"
    post:
      operationId: createPricing
      tags: [pricing]
      summary: Create a pricing tier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePricingBody"
      responses:
        "201":
          description: Pricing created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingTier"

  /pricing/{id}:
    put:
      operationId: updatePricing
      tags: [pricing]
      summary: Update a pricing tier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePricingBody"
      responses:
        "200":
          description: Pricing updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingTier"
    delete:
      operationId: deletePricing
      tags: [pricing]
      summary: Delete a pricing tier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /distance/calculate:
    post:
      operationId: calculateDistance
      tags: [distance]
      summary: Calculate distance between two locations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistanceRequest"
      responses:
        "200":
          description: Distance result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistanceResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    Car:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
        imageUrl:
          type: string
          nullable: true
        capacity:
          type: integer
        pricePerKm:
          type: number
        baseFee:
          type: number
        driverFee:
          type: number
          description: Extra fee added when chauffeur service is selected
        available:
          type: boolean
        category:
          type: string
          enum: [with_driver, without_driver, both]
        description:
          type: string
          nullable: true
        features:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - brand
        - model
        - year
        - capacity
        - pricePerKm
        - baseFee
        - driverFee
        - available
        - category
        - features
        - createdAt

    CreateCarBody:
      type: object
      properties:
        name:
          type: string
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
        imageUrl:
          type: string
          nullable: true
        capacity:
          type: integer
        pricePerKm:
          type: number
        baseFee:
          type: number
        driverFee:
          type: number
          description: Extra fee added when chauffeur service is selected
        available:
          type: boolean
        category:
          type: string
          enum: [with_driver, without_driver, both]
        description:
          type: string
          nullable: true
        features:
          type: array
          items:
            type: string
      required:
        - name
        - brand
        - model
        - year
        - capacity
        - pricePerKm
        - baseFee
        - category

    Driver:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        available:
          type: boolean
        rating:
          type: number
        languages:
          type: array
          items:
            type: string
        yearsExperience:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - available
        - rating
        - languages
        - yearsExperience
        - createdAt

    CreateDriverBody:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        available:
          type: boolean
        rating:
          type: number
        languages:
          type: array
          items:
            type: string
        yearsExperience:
          type: integer
      required:
        - name
        - yearsExperience

    Reservation:
      type: object
      properties:
        id:
          type: integer
        carId:
          type: integer
          nullable: true
        driverId:
          type: integer
          nullable: true
        car:
          $ref: "#/components/schemas/Car"
          nullable: true
        driver:
          $ref: "#/components/schemas/Driver"
          nullable: true
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
          nullable: true
        pickupLocation:
          type: string
        dropoffLocation:
          type: string
        pickupDate:
          type: string
          format: date
        pickupTime:
          type: string
        distanceKm:
          type: number
          nullable: true
        driverFee:
          type: number
          nullable: true
          description: Chauffeur service fee applied to this booking
        totalPrice:
          type: number
          nullable: true
        withDriver:
          type: boolean
        status:
          type: string
          enum: [pending, confirmed, in_progress, completed, cancelled]
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - customerName
        - customerEmail
        - pickupLocation
        - dropoffLocation
        - pickupDate
        - pickupTime
        - withDriver
        - status
        - createdAt

    CreateReservationBody:
      type: object
      properties:
        carId:
          type: integer
          nullable: true
        driverId:
          type: integer
          nullable: true
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
          nullable: true
        pickupLocation:
          type: string
        dropoffLocation:
          type: string
        pickupDate:
          type: string
          format: date
        pickupTime:
          type: string
        distanceKm:
          type: number
          nullable: true
        driverFee:
          type: number
          nullable: true
          description: Chauffeur service fee applied to this booking
        totalPrice:
          type: number
          nullable: true
        withDriver:
          type: boolean
        notes:
          type: string
          nullable: true
      required:
        - customerName
        - customerEmail
        - pickupLocation
        - dropoffLocation
        - pickupDate
        - pickupTime
        - withDriver

    UpdateReservationBody:
      type: object
      properties:
        carId:
          type: integer
          nullable: true
        driverId:
          type: integer
          nullable: true
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
          nullable: true
        pickupLocation:
          type: string
        dropoffLocation:
          type: string
        pickupDate:
          type: string
          format: date
        pickupTime:
          type: string
        distanceKm:
          type: number
          nullable: true
        driverFee:
          type: number
          nullable: true
        totalPrice:
          type: number
          nullable: true
        withDriver:
          type: boolean
        status:
          type: string
          enum: [pending, confirmed, in_progress, completed, cancelled]
        notes:
          type: string
          nullable: true

    CalendarEvent:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
        status:
          type: string
        customerName:
          type: string
        carName:
          type: string
          nullable: true
        driverName:
          type: string
          nullable: true
      required:
        - id
        - title
        - date
        - time
        - status
        - customerName

    PricingTier:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        pricePerKm:
          type: number
        baseFee:
          type: number
        category:
          type: string
          enum: [with_driver, without_driver, both]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - pricePerKm
        - baseFee
        - category
        - createdAt

    CreatePricingBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        pricePerKm:
          type: number
        baseFee:
          type: number
        category:
          type: string
          enum: [with_driver, without_driver, both]
      required:
        - name
        - pricePerKm
        - baseFee
        - category

    DashboardStats:
      type: object
      properties:
        totalReservations:
          type: integer
        pendingReservations:
          type: integer
        confirmedReservations:
          type: integer
        completedReservations:
          type: integer
        cancelledReservations:
          type: integer
        totalRevenue:
          type: number
        totalCars:
          type: integer
        availableCars:
          type: integer
        totalDrivers:
          type: integer
        availableDrivers:
          type: integer
        recentReservations:
          type: array
          items:
            $ref: "#/components/schemas/Reservation"
        revenueByMonth:
          type: array
          items:
            type: object
            properties:
              month:
                type: string
              revenue:
                type: number
            required:
              - month
              - revenue
      required:
        - totalReservations
        - pendingReservations
        - confirmedReservations
        - completedReservations
        - cancelledReservations
        - totalRevenue
        - totalCars
        - availableCars
        - totalDrivers
        - availableDrivers
        - recentReservations
        - revenueByMonth

    DistanceRequest:
      type: object
      properties:
        origin:
          type: string
        destination:
          type: string
      required:
        - origin
        - destination

    DistanceResult:
      type: object
      properties:
        distanceKm:
          type: number
        durationMinutes:
          type: number
        originAddress:
          type: string
        destinationAddress:
          type: string
      required:
        - distanceKm
        - durationMinutes
        - originAddress
        - destinationAddress
