kind = "web"
previewPath = "/"
title = "Elite Chauffeur"
version = "1.0.0"
id = "artifacts/elite-chauffeur"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19568

[services.development]
run = "pnpm --filter @workspace/elite-chauffeur run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/elite-chauffeur", "run", "build" ]
publicDir = "artifacts/elite-chauffeur/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19568"
BASE_PATH = "/"
